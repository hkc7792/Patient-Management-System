# ==========================================================
# Patient-Service: dev profile — Docker container environment
#
# DB config is NOT here. It is injected by Docker Compose as
# environment variables (SPRING_DATASOURCE_URL, USERNAME,
# PASSWORD, SPRING_JPA_HIBERNATE_DDL_AUTO). Spring Boot's
# relaxed binding maps them to properties automatically.
# ==========================================================

# ==========================================================
# JPA / Hibernate — dev-friendly logging
# ==========================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# H2 Console — explicitly disabled (no H2 in Docker)
# ==========================================================
spring.h2.console.enabled=false

# ==========================================================
# Flyway — disabled (DDL managed by Hibernate via compose env)
# ==========================================================
spring.flyway.enabled=false

# ==========================================================
# SpringDoc OpenAPI / Swagger UI — disabled for dev
# ==========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
