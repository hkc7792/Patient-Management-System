# ==========================================================
# H2 Datasource - patient-service test profile
# ==========================================================
spring.datasource.url=jdbc:h2:mem:patient_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# H2 Console (useful for debugging test data)
# ==========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# Flyway - disabled for test profile only
# (dev/prod profiles keep Flyway enabled against real Postgres)
# ==========================================================
spring.flyway.enabled=false

# ==========================================================
# SQL Initialisation (data.sql)
# Must defer until AFTER Hibernate has created the schema
# so that the ``patients`` table already exists when inserts run.
# ==========================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never